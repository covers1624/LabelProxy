plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
}

group = 'net.covers1624'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.covers1624.net/' }
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

    implementation 'net.covers1624:Quack:0.4.10.130'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.5'

    implementation 'org.apache.commons:commons-compress:1.28.0'

    implementation 'com.google.guava:guava:33.7.2-jre'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'org.shredzone.acme4j:acme4j-client:5.0.0'

    compileOnly 'org.jetbrains:annotations:23.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jar.enabled = false
shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'net.covers1624.lp.LabelProxy'
        attributes 'Multi-Release': 'true'
    }
    archiveClassifier = null
}
assemble.dependsOn(shadowJar)

idea.project.settings {
    delegateActions {
        // Gradle runners are garbage and break frequently.
        delegateBuildRunToGradle = false
        testRunner = org.jetbrains.gradle.ext.ActionDelegationConfig.TestRunner.PLATFORM
    }
}
